name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatched by tag-release.yaml because tags pushed with GITHUB_TOKEN do not
  # trigger another workflow.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag and changelog
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION v${VERSION}" >&2
            exit 1
          fi

          if ! grep -q "^## \\[$VERSION\\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Buzznode
            org.opencontainers.image.description=One persistent browser-accessible computer for one Buzz agent

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "content<<RELEASE_EOF"
            echo "Container image: \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" {
                found = 1
                next
              }
              found && /^## \[/ {
                exit
              }
              found {
                print
              }
            ' CHANGELOG.md
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.content }}
          prerelease: ${{ contains(github.ref_name, '-') }}
